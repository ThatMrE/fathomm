# Netlify configuration for fathomm.org

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_ENV = "production"

# Form settings - enable Netlify Forms
[functions]
  node_bundler = "esbuild"

# Redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache headers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Form handling configuration
[context.production]
  command = ""

# Enable form notifications (optional - add Netlify env variables)
# NETLIFY_FORM_EMAIL=your-email@example.com
