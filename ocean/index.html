<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FATHOMM — Ocean Voyages</title>
<meta name="description" content="Ocean Voyages. Dive deeper. Some things take time to surface. Recovery at sea, built around the procedure.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --deep: #0a1628; --deep-mid: #0d1f3c;
    --gold: #c9a84c; --gold-light: #e0c872;
    --cyan: #0ef5e3;
    --white: #f0f0f0; --white-dim: rgba(240,240,240,0.6);
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 120%, #0d2847 0%, #0a1628 55%, #060e1a 100%);
    color: var(--white);
    font-family: var(--sans);
    font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--gold); color: var(--deep); }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.25rem 3rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-logo {
    font-family: var(--serif); font-size: 1.5rem; font-weight: 600;
    letter-spacing: 0.3em; color: var(--gold); text-decoration: none;
  }
  .nav-links { display: flex; gap: 1.5rem; align-items: center; }
  .nav-links a {
    color: var(--white-dim); text-decoration: none; font-size: 0.8rem;
    letter-spacing: 0.12em; text-transform: uppercase; transition: color 0.3s; font-weight: 400;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-links a.active { color: var(--gold); }
  .nav-cta {
    border: 1px solid var(--gold); padding: 0.5rem 1.2rem; color: var(--gold);
    border-radius: 2px; transition: all 0.3s;
  }
  .nav-cta:hover { background: var(--gold); color: var(--deep); }
  @media (max-width: 720px) { .nav-links a:not(.nav-cta) { display: none; } }

  /* CONTENT */
  .content { position: relative; z-index: 2; max-width: 620px; padding: 2rem; }
  .label {
    font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--cyan); margin-bottom: 1.5rem;
    opacity: 0; animation: fadeUp 1s 0.2s forwards;
  }
  .title {
    font-family: var(--serif); font-size: clamp(3rem, 8vw, 5rem); font-weight: 300;
    letter-spacing: 0.15em; color: var(--white); line-height: 1; margin-bottom: 1.25rem;
    opacity: 0; animation: fadeUp 1s 0.4s forwards;
  }
  .tagline {
    font-family: var(--serif); font-style: italic; font-weight: 300;
    font-size: clamp(1.2rem, 3vw, 1.6rem); color: var(--gold); margin-bottom: 1.25rem;
    opacity: 0; animation: fadeUp 1s 0.6s forwards;
  }
  .body {
    font-size: 1rem; color: var(--white-dim); line-height: 1.9; max-width: 460px;
    margin: 0 auto; opacity: 0; animation: fadeUp 1s 0.8s forwards;
  }
  .gold-line {
    width: 60px; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 2.5rem auto; opacity: 0; animation: fadeIn 1s 1s forwards;
  }
  .dot {
    width: 7px; height: 7px; background: var(--gold); border-radius: 50%;
    display: inline-block; animation: pulse 2.4s ease-in-out infinite;
  }
  .surface {
    margin-top: 2.5rem; opacity: 0; animation: fadeUp 1s 1.1s forwards;
  }
  .surface a {
    color: var(--white-dim); text-decoration: none; font-size: 0.75rem;
    letter-spacing: 0.25em; text-transform: uppercase; transition: color 0.3s;
  }
  .surface a:hover { color: var(--gold); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }
</style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">FATHOMM</a>
    <div class="nav-links">
      <a href="/atlas/">Global Clinics</a>
      <a href="/ocean/" class="active">Ocean Voyages</a>
      <a href="/#waitlist" class="nav-cta">Join Waitlist</a>
    </div>
  </nav>

  <div class="content">
    <p class="label">Recovery at Sea</p>
    <h1 class="title">Ocean Voyages</h1>
    <p class="tagline">Dive deeper.</p>
    <p class="body">Some things take time to surface. Recovery reimagined as a voyage — private, unhurried, and built around the procedure.</p>
    <div class="gold-line"></div>
    <div class="dot"></div>
    <p class="surface"><a href="/atlas/">Surface into Global Clinics &rarr;</a></p>
  </div>
</body>
</html>
