<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fathomm — Ocean</title>
  <meta name="description" content="Fathomm. Dive deeper. Some things take time to surface.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --gold:#e9b949; --teal2:#12a5b0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #000a14 0%, #001428 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* ---------- NAV (shared design) ---------- */
    #nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;
      align-items:center;padding:14px 26px;color:#fff}
    #nav .brand{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;letter-spacing:.02em;
      display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
    #nav .brand svg{width:26px;height:26px}
    #nav .links{display:flex;gap:22px;font-size:14px;font-weight:500;align-items:center}
    #nav .links a{color:#dbe8ef;text-decoration:none;opacity:.85;transition:.2s}
    #nav .links a:hover{opacity:1;color:#fff}
    #nav .links a.active{opacity:1;color:#fff;border-bottom:2px solid var(--gold);padding-bottom:2px}
    #nav .links a.cta{background:var(--gold);color:#06304a;padding:8px 16px;border-radius:999px;
      font-weight:700;opacity:1}
    #nav .links a.cta:hover{background:#f4c95d}
    @media(max-width:820px){#nav .links a:not(.cta){display:none}}

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    .emoji {
      font-size: 5rem;
      display: block;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #0ea5e9;
      margin-bottom: 0.75rem;
    }
    .tagline {
      font-size: 1.2rem;
      opacity: 0.7;
      margin-bottom: 1.5rem;
      font-style: italic;
    }
    .body {
      font-size: 1rem;
      opacity: 0.55;
      line-height: 1.6;
    }
    .dot {
      width: 8px; height: 8px;
      background: #0ea5e9;
      border-radius: 50%;
      display: inline-block;
      margin: 2rem auto 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.6); }
    }
    .surface {
      margin-top: 2.5rem;
      font-size: .85rem;
      letter-spacing: .04em;
    }
    .surface a { color: #7fd4e6; text-decoration: none; opacity: .8; transition:.2s; }
    .surface a:hover { opacity: 1; }
  </style>
</head>
<body>
  <!-- ================= NAV ================= -->
  <nav id="nav">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c3 3 4 6 4 10s-1 7-4 10c-3-3-4-6-4-10S9 5 12 2z" fill="#e9b949"/><path d="M4 14c2.5 2 5 3 8 3s5.5-1 8-3" stroke="#9fe3ea" stroke-width="1.6" stroke-linecap="round"/></svg>
      Fathomm
    </a>
    <div class="links">
      <a href="/">Home</a>
      <a href="/atlas/">Medical Tourism Atlas</a>
      <a href="/ocean/" class="active">Ocean</a>
      <a href="/atlas/" class="cta">Explore the Atlas →</a>
    </div>
  </nav>

  <div class="container">
    <span class="emoji">🌊</span>
    <h1>Fathomm</h1>
    <p class="tagline">Dive deeper.</p>
    <p class="body">Some things take time to surface.</p>
    <div class="dot"></div>
    <p class="surface"><a href="/atlas/">Surface into the Medical-Tourism Atlas →</a></p>
  </div>
</body>
</html>
