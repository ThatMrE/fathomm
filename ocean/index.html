<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fathomm — Ocean Voyages</title>
  <meta name="description" content="Dive deeper. Some things take time to surface. Recover at sea, on a voyage built around the procedure.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg0:#000a14; --bg1:#001428; --accent:#0ea5e9; --accent2:#38bdf8; --accent-ink:#00121f;
      --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #000a14 0%, #001428 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* ---------- NAV (shared, minimalist) ---------- */
    #nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;
      align-items:center;padding:16px 26px;background:transparent}
    #nav .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:-.02em;
      color:#fff;text-decoration:none}
    #nav .brand .mark{font-size:20px}
    #nav .links{display:flex;gap:26px;align-items:center;font-size:15px;font-weight:500}
    #nav .links a{color:#cbd8e6;text-decoration:none;opacity:.85;transition:.2s}
    #nav .links a:hover{opacity:1;color:#fff}
    #nav .links a.active{color:var(--accent2);opacity:1}
    #nav .links a.cta{background:var(--accent);color:var(--accent-ink);padding:9px 18px;border-radius:999px;
      font-weight:700;opacity:1}
    #nav .links a.cta:hover{background:var(--accent2)}
    @media(max-width:720px){#nav .links a:not(.cta){display:none}}

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    .emoji {
      font-size: 5rem;
      display: block;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 10px 30px rgba(14,165,233,.35));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #0ea5e9;
      margin-bottom: 0.75rem;
    }
    .tagline {
      font-size: 1.2rem;
      opacity: 0.7;
      margin-bottom: 1.5rem;
      font-style: italic;
    }
    .body {
      font-size: 1rem;
      opacity: 0.55;
      line-height: 1.6;
    }
    .dot {
      width: 8px; height: 8px;
      background: #0ea5e9;
      border-radius: 50%;
      display: inline-block;
      margin: 2rem auto 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.6); }
    }
    .surface {
      margin-top: 2.5rem;
      font-size: .9rem;
      letter-spacing: .02em;
    }
    .surface a { color: #7fd4e6; text-decoration: none; opacity: .85; transition:.2s; }
    .surface a:hover { opacity: 1; color:#fff; }
  </style>
</head>
<body>
  <!-- ================= NAV ================= -->
  <nav id="nav">
    <a class="brand" href="/"><span class="mark">🌊</span> Fathomm</a>
    <div class="links">
      <a href="/ocean/" class="active">Ocean Voyages</a>
      <a href="/atlas/">Global Clinics</a>
      <a href="/#waitlist" class="cta">Join Waitlist</a>
    </div>
  </nav>

  <div class="container">
    <span class="emoji">🌊</span>
    <h1>Ocean Voyages</h1>
    <p class="tagline">Dive deeper.</p>
    <p class="body">Some things take time to surface. Recover at sea, on a voyage built around the procedure.</p>
    <div class="dot"></div>
    <p class="surface"><a href="/atlas/">Surface into Global Clinics →</a></p>
  </div>
</body>
</html>
